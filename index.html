<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; connect-src https://wrtsozqurfawpprbyplv.supabase.co wss://wrtsozqurfawpprbyplv.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>합동 비서실 · 채팅 &amp; 할 일</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1b1f2a;
      --muted: #667085;
      --border: #e4e7ec;
      --accent: #2f6fed;
      --accent-soft: #eef4ff;
      --danger: #d92d20;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(16, 24, 40, 0.04);
    }
    .login-box {
      max-width: 420px;
      margin: 64px auto;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 12px 0 6px;
    }
    input, select, button {
      font: inherit;
    }
    input[type="password"], input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary {
      background: #eef1f6;
      color: var(--text);
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 12px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .err {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .topbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .topbar-right select {
      width: auto;
      padding: 7px 10px;
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .chat-list {
      height: 380px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fafbfe;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }
    .msg {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .msg-sender {
      font-weight: 700;
      color: var(--text);
    }
    .msg-body {
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row-form {
      display: flex;
      gap: 8px;
    }
    .row-form input {
      flex: 1;
    }
    .todo-list {
      list-style: none;
      margin: 0 0 12px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }
    .todo-item.done .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .todo-title {
      flex: 1;
      font-size: 14px;
      word-break: break-word;
    }
    .todo-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #475467;
      white-space: nowrap;
    }
    .hidden { display: none; }
    .empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 24px 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 로그인 잠금 화면 -->
    <div id="loginView" class="card login-box">
      <h1>🔒 합동 비서실 입장</h1>
      <p class="sub">비밀번호를 입력해야 채팅과 할 일 목록을 읽고 쓸 수 있습니다.</p>
      <form id="loginForm">
        <label for="loginRole">접속자</label>
        <select id="loginRole">
          <option value="창민">창민</option>
          <option value="창민 피클">창민 피클</option>
          <option value="협업 피클">협업 피클</option>
        </select>
        <label for="loginPassword">접속 비밀번호</label>
        <input id="loginPassword" type="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password" />
        <div style="margin-top: 14px;">
          <button id="loginBtn" type="submit" style="width: 100%;">입장하기</button>
        </div>
        <div id="loginError" class="err"></div>
      </form>
    </div>

    <!-- 메인 비서실 화면 -->
    <div id="appView" class="hidden">
      <div class="topbar card">
        <div>
          <h1>🥒 합동 비서실 <span class="badge">실시간 동기화</span></h1>
          <p class="sub" style="margin: 2px 0 0;">비서 협업 채팅방 &amp; 할 일 목록</p>
        </div>
        <div class="topbar-right">
          <select id="senderSelect" aria-label="보내는 사람">
            <option value="창민">창민</option>
            <option value="창민 피클">창민 피클</option>
            <option value="협업 피클">협업 피클</option>
          </select>
          <button id="logoutBtn" class="secondary" type="button">나가기</button>
        </div>
      </div>

      <div class="grid">
        <!-- 채팅창 -->
        <section class="card">
          <h2>💬 비서실 채팅</h2>
          <div id="chatList" class="chat-list"></div>
          <form id="chatForm" class="row-form">
            <input id="chatInput" type="text" maxlength="1000" placeholder="메시지를 입력하세요..." required />
            <button type="submit">전송</button>
          </form>
        </section>

        <!-- 할 일 목록 -->
        <section class="card">
          <h2>✅ 할 일 목록</h2>
          <ul id="todoList" class="todo-list"></ul>
          <form id="todoForm" class="row-form" style="flex-wrap: wrap;">
            <input id="todoInput" type="text" maxlength="200" placeholder="새 할 일을 입력하세요..." required style="min-width: 160px;" />
            <select id="todoAssignee" style="width: auto;">
              <option value="공통">공통</option>
              <option value="창민">창민</option>
              <option value="창민 피클">창민 피클</option>
              <option value="협업 피클">협업 피클</option>
            </select>
            <button type="submit">추가</button>
          </form>
        </section>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wrtsozqurfawpprbyplv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q6hlhuLDKnk8ixy-IXYlUw_8DC5OYfo";
    const OFFICE_EMAIL = "office@pickle-family.local";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const loginForm = document.getElementById("loginForm");
    const loginRole = document.getElementById("loginRole");
    const loginPassword = document.getElementById("loginPassword");
    const loginError = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");

    const senderSelect = document.getElementById("senderSelect");
    const logoutBtn = document.getElementById("logoutBtn");
    const chatList = document.getElementById("chatList");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const todoList = document.getElementById("todoList");
    const todoForm = document.getElementById("todoForm");
    const todoInput = document.getElementById("todoInput");
    const todoAssignee = document.getElementById("todoAssignee");

    let channel = null;

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleString("ko-KR", {
          month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
      } catch {
        return "";
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadMessages() {
      const { data, error } = await sb
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(100);
      if (error) return;
      if (!data.length) {
        chatList.innerHTML = '<div class="empty">아직 메시지가 없어요. 첫 인사를 남겨 보세요!</div>';
        return;
      }
      chatList.innerHTML = data.map((m) => `
        <div class="msg">
          <div class="msg-head">
            <span class="msg-sender">${escapeHtml(m.sender)}</span>
            <span>${formatTime(m.created_at)} <button class="ghost" data-del-msg="${Number(m.id)}">삭제</button></span>
          </div>
          <div class="msg-body">${escapeHtml(m.content)}</div>
        </div>
      `).join("");
      chatList.scrollTop = chatList.scrollHeight;
    }

    async function loadTodos() {
      const { data, error } = await sb
        .from("todos")
        .select("*")
        .order("done", { ascending: true })
        .order("created_at", { ascending: false })
        .limit(100);
      if (error) return;
      if (!data.length) {
        todoList.innerHTML = '<li class="empty">등록된 할 일이 없습니다.</li>';
        return;
      }
      todoList.innerHTML = data.map((t) => `
        <li class="todo-item ${t.done ? "done" : ""}">
          <input type="checkbox" data-toggle-todo="${Number(t.id)}" ${t.done ? "checked" : ""} />
          <span class="todo-title">${escapeHtml(t.title)}</span>
          <span class="todo-tag">${escapeHtml(t.assignee || "공통")}</span>
          <button class="ghost" data-del-todo="${Number(t.id)}">삭제</button>
        </li>
      `).join("");
    }

    chatList.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-del-msg]");
      if (!btn) return;
      const id = Number(btn.getAttribute("data-del-msg"));
      if (Number.isInteger(id)) await sb.from("messages").delete().eq("id", id);
    });

    todoList.addEventListener("change", async (e) => {
      const cb = e.target.closest("[data-toggle-todo]");
      if (!cb) return;
      const id = Number(cb.getAttribute("data-toggle-todo"));
      if (Number.isInteger(id)) await sb.from("todos").update({ done: cb.checked }).eq("id", id);
    });

    todoList.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-del-todo]");
      if (!btn) return;
      const id = Number(btn.getAttribute("data-del-todo"));
      if (Number.isInteger(id)) await sb.from("todos").delete().eq("id", id);
    });

    function subscribeRealtime() {
      if (channel) sb.removeChannel(channel);
      channel = sb
        .channel("family-pickle-office-sync")
        .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, loadMessages)
        .on("postgres_changes", { event: "*", schema: "public", table: "todos" }, loadTodos)
        .subscribe();
    }

    async function enterOffice() {
      const savedSender = localStorage.getItem("office_sender");
      if (savedSender) {
        const hasOption = Array.from(senderSelect.options).some((o) => o.value === savedSender);
        if (hasOption) senderSelect.value = savedSender;
      }
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      await Promise.all([loadMessages(), loadTodos()]);
      subscribeRealtime();
    }

    function leaveOffice() {
      if (channel) {
        sb.removeChannel(channel);
        channel = null;
      }
      appView.classList.add("hidden");
      loginView.classList.remove("hidden");
      loginPassword.value = "";
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      loginBtn.disabled = true;
      const { error } = await sb.auth.signInWithPassword({
        email: OFFICE_EMAIL,
        password: loginPassword.value
      });
      loginBtn.disabled = false;
      if (error) {
        loginError.textContent = "비밀번호가 올바르지 않습니다.";
        return;
      }
      localStorage.setItem("office_sender", loginRole.value);
      await enterOffice();
    });

    senderSelect.addEventListener("change", () => {
      localStorage.setItem("office_sender", senderSelect.value);
    });

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      leaveOffice();
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content) return;
      chatInput.value = "";
      await sb.from("messages").insert({ sender: senderSelect.value, content });
    });

    todoForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = todoInput.value.trim();
      if (!title) return;
      todoInput.value = "";
      await sb.from("todos").insert({ title, assignee: todoAssignee.value, done: false });
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        await enterOffice();
      }
    })();
  </script>
</body>
</html>
